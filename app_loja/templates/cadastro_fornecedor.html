<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Fornecedor | ModaLink</title>

<!-- 🔧 IMPORTAÇÃO NECESSÁRIA PARA A SETA FUNCIONAR -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
    body {
        background-color: #6a0dad; /* fundo roxo */
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 40px;
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
    }

    .form-card {
        background-color: #fff;
        border-radius: 15px;
        padding: 35px 40px 40px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        margin-bottom: 40px;
        position: relative;
    }

    /* 🔙 Seta roxa de voltar */
    .back-arrow {
        font-size: 1.6rem;
        color: #6a0dad;
        cursor: pointer;
        position: absolute;
        left: 20px;
        top: 20px;
    }

    .back-arrow:hover {
        color: #4b0082;
        transform: translateX(-4px);
    }

    .form-card h1 {
        text-align: center;
        color: #6a0dad;
        margin-bottom: 5px;
        font-size: 26px;
        padding-left: 20px;
    }

    .form-card p {
        text-align: center;
        color: #444;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .form-card h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #6a0dad;
        font-size: 20px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        font-weight: 600;
        font-size: 14px;
        display: block;
        margin-bottom: 5px;
        color: #333;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #bbb;
        font-size: 14px;
        box-sizing: border-box;
    }

    .form-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .form-row .form-group {
        flex: 1;
        min-width: 140px;
    }

    .btn-primary {
        background-color: #6a0dad;
        color: #fff;
        width: 100%;
        border: none;
        padding: 12px;
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-primary:hover {
        background-color: #4b0082;
    }

    @media (max-width: 600px) {
        .form-card { 
            padding: 25px;
            max-width: 92%;
        }
        .back-arrow {
            left: 12px;
            top: 12px;
        }
    }
</style>
</head>
<body>

<div class="form-card">

    <!-- 🔙 SETA ROXA DE VOLTAR -->
    <span class="back-arrow" onclick="window.history.back()">
        <i class="bi bi-arrow-left"></i>
    </span>

    <h1>Cadastro de Fornecedor</h1>
    <p>Adicione um novo fornecedor ao sistema</p>

    <form id="formCadastroFornecedor">

        <div class="form-group">
            <label>Nome do fornecedor</label>
            <input type="text" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>CNPJ</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Nome do representante</label>
                <input type="text" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>CPF do representante</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Telefone 1</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Telefone 2</label>
                <input type="text">
            </div>
        </div>

        <h2>Endereço</h2>

        <div class="form-row">
            <div class="form-group">
                <label>Rua</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Número</label>
                <input type="text" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Bairro</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>CEP</label>
                <input type="text" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Estado</label>
                <select required>
                    <option value="">Selecione o estado</option>
                    <option>SP</option>
                    <option>RJ</option>
                    <option>MG</option>
                    <option>BA</option>
                    <option>Outros</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Observações</label>
            <textarea rows="3"></textarea>
        </div>

        <button type="submit" class="btn-primary">Cadastrar Fornecedor</button>
    </form>

</div>

<script>
document.getElementById('formCadastroFornecedor').addEventListener('submit', function(e){
    e.preventDefault();
    const inputs = this.querySelectorAll('input, select, textarea');
    const data = {};
    inputs.forEach(input => data[input.previousElementSibling.innerText] = input.value);
    console.log(data);
    alert('Fornecedor cadastrado com sucesso! (simulação)');
    this.reset();
});
</script>

</body>
</html>
