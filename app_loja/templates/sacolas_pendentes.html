<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacolas | ModaLink</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background: #f3f0ff;
    font-family: 'Segoe UI', sans-serif;
}

.navbar {
    background-color: #6a0dad !important;
}

.navbar-brand {
    color: #fff !important;
    font-weight: 600;
}

.page-title {
    color: #4c0070;
    font-weight: 700;
}

.back-arrow {
    font-size: 1.5rem;
    color: #6a0dad;
    cursor: pointer;
    margin-right: 10px;
}

.table-card {
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    padding: 15px;
    margin-bottom: 25px;
}

.btn-purple {
    background-color: #6a0dad;
    color: white;
}
.btn-purple:hover {
    background-color: #5900b5;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="home_loja.html">ModaLink - Loja</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Cabeçalho -->
    <div class="d-flex align-items-center mb-4">
        <span class="back-arrow" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i>
        </span>
        <h2 class="page-title mb-0">Sacolas</h2>
    </div>

    <!-- ===================== 1) SACOLAS RODANDO ===================== -->
    <h4 class="mb-3 text-primary fw-bold">Sacolas Rodando</h4>
    <div class="table-card">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Revendedora</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody id="tbodyRodando"></tbody>
        </table>
    </div>

    <!-- ===================== 2) SACOLAS PAGAMENTO PENDENTE ===================== -->
    <h4 class="mb-3 text-danger fw-bold">Pagamento Pendente</h4>
    <div class="table-card">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Revendedora</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody id="tbodyPagamento"></tbody>
        </table>
    </div>

</div>

<script>
// ======================== DADOS EXEMPLO ==========================
const sacolas = [
    { codigo: "S001", nome: "Ana Santos", status: "Rodando" },
    { codigo: "S005", nome: "Carla Souza", status: "Rodando" },
    { codigo: "S015", nome: "Beatriz Lima", status: "Pagamento Pendente" },
    { codigo: "S022", nome: "Mariana Silva", status: "Pagamento Pendente" },
    { codigo: "S030", nome: "Patrícia Rocha", status: "Rodando" }
];

// Seletores
const tbodyRodando = document.getElementById("tbodyRodando");
const tbodyPagamento = document.getElementById("tbodyPagamento");

// Preencher tabela "Rodando"
sacolas
.filter(s => s.status === "Rodando")
.forEach(s => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td>${s.codigo}</td>
        <td>${s.nome}</td>
        <td>${s.status}</td>
        <td class="text-end">
            <button class="btn btn-purple btn-sm" onclick="verSacola('${s.codigo}')">
                Ver Sacola
            </button>
        </td>
    `;
    tbodyRodando.appendChild(tr);
});

// Preencher tabela "Pagamento Pendente"
sacolas
.filter(s => s.status === "Pagamento Pendente")
.forEach(s => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td>${s.codigo}</td>
        <td>${s.nome}</td>
        <td>${s.status}</td>
        <td class="text-end">
            <button class="btn btn-purple btn-sm" onclick="verSacola('${s.codigo}')">
                Ver Sacola
            </button>
        </td>
    `;
    tbodyPagamento.appendChild(tr);
});

// Função para abrir a tela da sacola
function verSacola(codigo) {
    window.location.href = `sacola_item.html?codigo=${codigo}`;
}
</script>

</body>
</html>
