    <style>
        /* ===== PADRÃO DO LOGIN ===== */
        body {
            background-color: #6a0dad; /* fundo roxo */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        /* ===== CARD DO FORMULÁRIO ===== */
        .form-card {
            background-color: #fff;
            border-radius: 15px;
            padding: 35px 40px;
            width: 100%;
            max-width: 450px; /* formulário menor */
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        .form-card h1 {
            text-align: center;
            color: #6a0dad;
            margin-bottom: 5px;
            font-size: 26px;
        }

        .form-card p {
            text-align: center;
            color: #444;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #6a0dad;
            font-size: 20px;
        }

        /* ===== INPUTS ===== */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #bbb;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* ===== LINHAS FLEX ===== */
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 140px;
        }

        /* ===== BOTÃO PADRONIZADO ===== */
        .btn-primary {
            background-color: #6a0dad;
            color: #fff;
            width: 100%;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
         /* ✔ SETA FUNCIONANDO */
    .back-arrow {
        font-size: 1.6rem;
        color: #6a0dad;
        cursor: pointer;
        position: absolute;
        left: 20px;
        top: 20px;
    }

    .back-arrow:hover {
        color: #4b0082;
        transform: translateX(-3px);
    }

        .btn-primary:hover {
            background-color: #4b0082;
        }

        @media (max-width: 600px) {
            .form-card { 
                padding: 25px;
                max-width: 92%;
            }
            input, select {
                padding: 8px;
            }
        }
    </style>

</head>
