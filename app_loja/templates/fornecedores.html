<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fornecedores | ModaLink</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body { background: #f3f0ff; font-family: 'Segoe UI', sans-serif; }
.navbar { background-color: #6a0dad !important; }
.navbar-brand { color: #fff !important; font-weight: 600; }
.page-title { color: #4c0070; font-weight: 700; text-align: center; }
.btn-purple { background-color: #6a0dad; color: white; }
.btn-purple:hover { background-color: #5900b5; color: white; }

.table-card { border-radius: 12px; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,0.1); padding: 12px; margin-bottom: 20px; }
.table-card table { margin-bottom: 0; width: 100%; }
.table-card th, .table-card td { vertical-align: middle; }
.table-card th:last-child, .table-card td:last-child { text-align: right; }
.table-card tr:hover { background: #f7f3ff; cursor: pointer; }

.info-box { background: #f7f3ff; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
.cor-bolinha { width: 18px; height: 18px; border-radius: 50%; display: inline-block; margin-right: 4px; border: 1px solid #222; }

.back-arrow { font-size: 1.5rem; color: #6a0dad; cursor: pointer; margin-right: 10px; }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="home_loja.html">ModaLink - Loja</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Título + Voltar + Botão -->
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div class="d-flex align-items-center">
            <span class="back-arrow" onclick="window.history.back()"><i class="bi bi-arrow-left"></i></span>
            <h2 class="page-title mb-0">Fornecedores</h2>
        </div>
        <div>
            <a href="cadastro_fornecedor.html" class="btn btn-purple">
                <i class="bi bi-plus-circle"></i> Cadastrar novo fornecedor
            </a>
        </div>
    </div>

    <!-- TABELA DE FORNECEDORES -->
    <div class="table-card">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Data de cadastro</th>
                </tr>
            </thead>
            <tbody id="fornecedores-tbody">
                <tr onclick="abrirModalFornecedor('ModaStore')">
                    <td>ModaStore</td>
                    <td>10/01/2025</td>
                </tr>
                <tr onclick="abrirModalFornecedor('FashionHouse')">
                    <td>FashionHouse</td>
                    <td>20/02/2025</td>
                </tr>
                <tr onclick="abrirModalFornecedor('LojaEstilo')">
                    <td>LojaEstilo</td>
                    <td>15/03/2025</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- MODAL DETALHES FORNECEDOR -->
<div class="modal fade" id="modalFornecedor" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalFornecedorNome">Fornecedor</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <h6 class="fw-bold mb-3">Peças vinculadas:</h6>
                <div class="row" id="modalPeçasFornecedor">
                    <!-- Cards das peças vinculadas -->
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Simulação de peças vinculadas
const fornecedores = {
    "ModaStore": [
        { nome: "Camiseta Branca", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" },
        { nome: "Calça Jeans Azul", img: "https://images.unsplash.com/photo-1580910051073-466198a3f3ff" }
    ],
    "FashionHouse": [
        { nome: "Vestido Vermelho", img: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c" }
    ],
    "LojaEstilo": [
        { nome: "Jaqueta Preta", img: "https://images.unsplash.com/photo-1593032457863-0e0e1d53f185" },
        { nome: "Blusa Listrada", img: "https://images.unsplash.com/photo-1593032457863-0e0e1d53f185" }
    ]
};

// Abrir modal do fornecedor e listar peças
function abrirModalFornecedor(nome) {
    document.getElementById('modalFornecedorNome').textContent = nome;
    const container = document.getElementById('modalPeçasFornecedor');
    container.innerHTML = "";
    fornecedores[nome].forEach(peca => {
        const card = document.createElement('div');
        card.className = "col-sm-6 col-md-4 col-lg-3 mb-3";
        card.innerHTML = `
            <div class="card p-2 shadow-sm" style="cursor:pointer;" onclick="irParaEstoque('${peca.nome}')">
                <img src="${peca.img}" class="img-fluid rounded mb-2">
                <h6 class="fw-bold mb-0">${peca.nome}</h6>
            </div>
        `;
        container.appendChild(card);
    });
    const modal = new bootstrap.Modal(document.getElementById('modalFornecedor'));
    modal.show();
}

// Simulação: ir para peça na tabela de estoque
function irParaEstoque(nome) {
    // Aqui você pode abrir estoque.html e rolar até a peça
    alert(`Levar até a peça "${nome}" na tela de estoque`);
    // window.location.href = `estoque.html#${nome.replace(/\s/g,'')}`;
}
</script>

</body>
</html>
