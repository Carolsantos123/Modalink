<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Peças | ModaLink</title>

<!-- 🔥 Ícones do Bootstrap (necessário para a seta funcionar) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
    body {
        background-color: #6a0dad;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 40px;
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
    }

    .form-card {
        background-color: #fff;
        border-radius: 15px;
        padding: 35px 40px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        margin-bottom: 40px;
        position: relative;
    }

    .form-card h1 {
        text-align: center;
        color: #6a0dad;
        margin-bottom: 5px;
        font-size: 26px;
    }

    .form-card p {
        text-align: center;
        color: #444;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .form-card h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #6a0dad;
        font-size: 20px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        font-weight: 600;
        font-size: 14px;
        display: block;
        margin-bottom: 5px;
        color: #333;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #bbb;
        font-size: 14px;
        box-sizing: border-box;
    }

    .btn-primary {
        background-color: #6a0dad;
        color: #fff;
        width: 100%;
        border: none;
        padding: 12px;
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-primary:hover {
        background-color: #4b0082;
    }

    .color-option {
        width: 30px;
        height: 30px;
        border-radius: 4px;
        cursor: pointer;
        border: 2px solid transparent;
        display: inline-block;
        margin-right: 5px;
        margin-bottom: 5px;
    }

    /* ✔ SETA FUNCIONANDO */
    .back-arrow {
        font-size: 1.6rem;
        color: #6a0dad;
        cursor: pointer;
        position: absolute;
        left: 20px;
        top: 20px;
    }

    .back-arrow:hover {
        color: #4b0082;
        transform: translateX(-3px);
    }

    .color-option.selected {
        border: 2px solid #6a0dad;
    }

    @media (max-width: 600px) {
        .form-card { 
            padding: 25px;
            max-width: 92%;
        }
        input, select, textarea {
            padding: 8px;
        }
    }
</style>
</head>
<body>

<div class="form-card">

    <!-- 🔙 SETA DE VOLTAR CORRIGIDA -->
    <span class="back-arrow" onclick="window.history.back()">
        <i class="bi bi-arrow-left"></i>
    </span>

    <h1>Cadastro de Peças</h1>
    <br>

    <form id="formCadastroPeca">

        <div class="form-group">
            <label>Importar Nota Fiscal (XML)</label>
            <input type="file" accept=".xml" id="inputXML">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Número da Nota</label>
                <input type="text" name="numeroNota">
            </div>
            <div class="form-group">
                <label>Data de Emissão</label>
                <input type="date" name="dataNota">
            </div>
        </div>

        <div class="form-group">
            <label>Fornecedor</label>
            <input type="text" name="fornecedor" placeholder="Nome do fornecedor">
        </div>

        <div class="form-group">
            <label>Quantidade de Itens</label>
            <input type="number" name="quantidadeItens" placeholder="Quantidade">
        </div>

        <div class="form-group">
            <label>Nome da Peça</label>
            <input type="text" name="nomePeca" placeholder="Ex: Camiseta Branca">
        </div>

        <div class="form-group">
            <label>Preço Unitário</label>
            <input type="number" name="precoPeca" step="0.01" placeholder="R$ 0,00">
        </div>

        <div class="form-group">
            <label>Descrição</label>
            <textarea name="descricaoPeca" rows="3" placeholder="Descrição da peça"></textarea>
        </div>

        <div class="form-group">
            <label>Cores Disponíveis</label>
            <div id="color-picker">
                <div class="color-option" data-color="#ffffff" style="background:#ffffff;"></div>
                <div class="color-option" data-color="#000000" style="background:#000000;"></div>
                <div class="color-option" data-color="#808080" style="background:#808080;"></div>
                <div class="color-option" data-color="#ffb6c1" style="background:#ffb6c1;"></div>
            </div>
        </div>

        <div class="form-group">
            <label>Tamanhos Disponíveis</label>
            <input type="text" name="tamanhosPeca" placeholder="Ex: P, M, G, GG">
        </div>

        <button type="submit" class="btn-primary">Cadastrar Peça</button>

    </form>

</div>

<script>
    // Seleção de cores
    const colorOptions = document.querySelectorAll('.color-option');
    colorOptions.forEach(color => {
        color.addEventListener('click', () => {
            color.classList.toggle('selected');
        });
    });

    // Submissão (simulação)
    document.getElementById('formCadastroPeca').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const coresSelecionadas = Array.from(document.querySelectorAll('.color-option.selected'))
                                       .map(c => c.dataset.color);
        const data = Object.fromEntries(formData.entries());
        data.coresSelecionadas = coresSelecionadas;
        console.log('Peça cadastrada:', data);
        alert('Peça cadastrada com sucesso! (simulação)');
        e.target.reset();
        document.querySelectorAll('.color-option.selected').forEach(c => c.classList.remove('selected'));
    });
</script>

</body>
</html>
