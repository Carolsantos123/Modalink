    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f3f0ff;
            font-family: 'Segoe UI', sans-serif;
        }

        /* NAV */
        .navbar {
            background-color: #6a0dad;
        }

        .navbar-brand {
            color: #fff !important;
            font-weight: 600;
        }

        .icon-sacola, .icon-perfil {
            font-size: 1.5rem;
            color: #fff;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        /* CARROSSEL */
        .carousel-item img {
            border-radius: 18px;
            height: 180px;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .carousel-item img {
                height: 240px;
            }
        }

        /* SEARCH BAR */
        .search-box {
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 8px 18px;
            display: flex;
            align-items: center;
        }

        .search-box input {
            border: none;
            width: 100%;
            margin-left: 10px;
            outline: none;
            background: transparent;
        }

        /* CATEGORIAS SCROLL */
        .categoria-scroll {
            display: flex;
            overflow-x: auto;
            gap: 22px;
            padding-bottom: 8px;
        }

        .categoria-circle {
            min-width: 110px;
            height: 110px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 8px;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .categoria-circle:hover {
            transform: translateY(-4px);
        }

        .categoria-circle img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 50%;
            object-position: center center;
        }

        .categoria-title {
            font-size: 0.78rem;
            margin-top: 6px;
            font-weight: 600;
            text-align: center;
            color: #4c0070;
        }

        /* CARDS */
        .peca-card {
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.09);
            overflow: hidden;
        }

        .peca-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .price-tag {
            color: #6a0dad;
            font-weight: bold;
        }

        .circle-color {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            border: 1px solid #ccc;
        }

        .btn-purple {
            background-color: #6a0dad;
            color: white;
        }

        .btn-purple:hover {
            background-color: #580c9c;
            color: white;
        }

        .modal-header {
            background: #6a0dad;
            color: white;
        }

        .info-box {
            background: #f7f2ff;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
